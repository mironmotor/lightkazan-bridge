<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Казань новости</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f2f2f2;
      color: #1a1a1a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      background: #1e1e1e;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header__burger {
      width: 24px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .header__burger span {
      display: block;
      height: 2px;
      background: #fff;
      border-radius: 1px;
    }

    .header__logo {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.06em;
    }

    .header__search {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .header__search svg {
      width: 24px;
      height: 24px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ─── Navigation Tabs ─── */
    .nav {
      background: #fff;
      display: flex;
      border-bottom: 1px solid #e0e0e0;
      padding: 0 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav__item {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }

    .nav__item--active {
      color: #1a1a1a;
      border-bottom-color: #1a1a1a;
    }

    .nav__item:hover {
      color: #1a1a1a;
    }

    /* ─── Breaking News Ticker ─── */
    .ticker {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticker__badge {
      background: #e74c3c;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 3px;
      letter-spacing: 0.08em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ticker__text {
      font-size: 12px;
      color: #444;
      line-height: 1.4;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ─── Main News Card ─── */
    .main-news {
      max-width: 680px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .main-news__card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .main-news__image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #ddd;
    }

    .main-news__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main-news__label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #e74c3c;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .main-news__body {
      padding: 16px 16px 20px;
    }

    .main-news__date {
      font-size: 11px;
      color: #999;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .main-news__title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      color: #1a1a1a;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header__burger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="header__logo">КАЗАНЬ</div>
    <div class="header__search">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
    </div>
  </div>

  <!-- Navigation -->
  <div class="nav">
    <a class="nav__item nav__item--active">Новости</a>
    <a class="nav__item">СВО</a>
    <a class="nav__item">Общество</a>
  </div>

  <!-- Breaking News Ticker -->
  <div class="ticker">
    <span class="ticker__badge">СРОЧНО</span>
    <span class="ticker__text">Калуга. В Тульской области перевернулся автобус, следовавший по маршруту Калуга – Тула. Пострадали 12 человек.</span>
  </div>

  <!-- Main News Card -->
  <div class="main-news">
    <div class="main-news__card">
      <div class="main-news__image-wrapper">
        <!-- Placeholder — замени src на реальное фото ДТП -->
        <img class="main-news__image" src="https://via.placeholder.com/680x382/e8e8e8/999?text=Фото+ДТП" alt="ДТП">
        <span class="main-news__label">ДТП</span>
      </div>
      <div class="main-news__body">
        <div class="main-news__date">14 МАЯ 2025 | 21:07</div>
        <h1 class="main-news__title">Водитель такси врезался в отбойник на трассе М-7 в Лаишевском районе</h1>
      </div>
    </div>
  </div>

</body>
</html>
